name: Verify reproduction reference
on:
  push:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'examples/reproduction/**', 'scripts/make-synthetic-fixture.py', 'scripts/make-panel-fixture.py', 'scripts/make-infra-fixture.py', '.github/workflows/reproduction.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'examples/reproduction/**', 'scripts/make-synthetic-fixture.py', 'scripts/make-panel-fixture.py', 'scripts/make-infra-fixture.py', '.github/workflows/reproduction.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,parquet]"
      - run: python -m pytest -q
  qlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MLFLOW_TRACKING_URI: file:///tmp/quantglean-mlruns
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,qlib]"
      - run: python -m pytest -q tests/test_panel.py -k qlib
