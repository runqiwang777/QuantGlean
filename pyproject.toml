[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantglean"
version = "0.4.0"
description = "Evidence-grounded quantitative research notes and reproducible alpha experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Runqi Wang (Allen)"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
parquet = ["pyarrow>=17,<24"]
reports = ["quantstats==0.0.81"]
dev = ["pytest>=8,<10"]
qlib = ["pyqlib==0.9.7"]

[project.scripts]
qg = "quantglean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
